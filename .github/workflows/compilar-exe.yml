name: Build Windows executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows a manual run from GitHub

jobs:
  build:
    runs-on: windows-latest # Build on a hosted Windows runner

    steps:
    - name: Check out source
      uses: actions/checkout@v4

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish the project
      run: dotnet publish src/MatVisor/MatVisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out

    - name: Upload the generated executable
      uses: actions/upload-artifact@v4
      with:
        name: MatVisor-Windows-EXE
        path: out/MatVisor.exe
